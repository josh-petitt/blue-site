services:
  nginx:
    image: nginx:latest
    ports:
      - "8103:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8104:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
    depends_on:
      - db
    restart: always

  db:
    image: mysql:5.7
    container_name: dvwa-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
    volumes:
      - ./data:/var/lib/mysql
    restart: always
